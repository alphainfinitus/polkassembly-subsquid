manifestVersion: subsquid.io/v0.1
name: polkadot-assethub-unified-pa
version: 3
description: |-
  Polkadot relay chain and Asset Hub governance proposals unified

build:

deploy:
  addons:
    postgres:
        config:
          statement_timeout: 100000
          max_pred_locks_per_transaction: 1024
          max_locks_per_transaction: 1024
  secrets:
    - NOTIFICATION_API_KEY
    - TOOLS_PASSPHRASE
  processor:
    - name: polkadot-processor
      cmd: [ "sqd", "process:prod:polkadot" ]
    - name: assethub-polkadot-processor
      cmd: [ "sqd", "process:prod:assethub" ]
  api:
    cmd: [ "npx", "squid-graphql-server", "--subscriptions" ]

scale:
  dedicated: true
  addons:
     postgres:
         storage: 20Gi
         profile: medium
  processor:
     profile: medium
  api:
     profile: medium
     replicas: 1