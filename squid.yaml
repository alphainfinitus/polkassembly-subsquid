manifestVersion: subsquid.io/v0.1
name: kusama-assethub-unified-pa
version: 1
description: |-
  Kusama's relay chain and assethub governance proposals

build:

deploy:
  addons:
    postgres:
        config:
          statement_timeout: 100000
          max_pred_locks_per_transaction: 1024
          max_locks_per_transaction: 1024
  secrets:
    - NOTIFICATION_API_KEY
    - GOV_EVENT_API_KEY
    - TOOLS_PASSPHRASE
  processor:
    cmd: [ "node", "lib/processor" ] 
  api:
    cmd: [ "npx", "squid-graphql-server", "--subscriptions", "--sql-statement-timeout", "3000" ]

scale:
  dedicated: true
  addons:
     postgres:
         storage: 20Gi
         profile: medium
  processor:
     profile: medium
  api:
     profile: medium
     replicas: 1