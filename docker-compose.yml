version: "3"

services:
  db:
    container_name: subsquid_db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: squid
      POSTGRES_PASSWORD: squid
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d squid"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      target: processor
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: squid
      DB_PASS: squid
    command: ["npm", "run", "db:migrate"]

  processor-kusama:
    restart: always
    build:
      context: .
      target: processor
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: squid
      DB_PASS: squid
      NOTIFICATION_API_KEY: "${NOTIFICATION_API_KEY}"
      TOOLS_PASSPHRASE: "${TOOLS_PASSPHRASE}"
    command: ["npm", "run", "processor:start"]

  processor-assethub:
    restart: always
    build:
      context: .
      target: processor
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: squid
      DB_PASS: squid
      NOTIFICATION_API_KEY: "${NOTIFICATION_API_KEY}"
      TOOLS_PASSPHRASE: "${TOOLS_PASSPHRASE}"
    command: ["npm", "run", "processor:start:assethub"]

  api:
    restart: always
    build:
      context: .
      target: query-node
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: squid
      DB_PASS: squid
      GQL_PORT: 4350
    ports:
      - "${GQL_PORT}:4350"

  prometheus:
    image: prom/prometheus:v2.45.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
      - ./datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.sendgrid.net:587
      - GF_SMTP_USER=apikey
      - GF_SMTP_PASSWORD=${SENDGRID_API_KEY}
      - GF_SMTP_FROM_ADDRESS=${ALERT_EMAIL}
      - GF_SMTP_FROM_NAME=Subsquid Alert
      - ALERT_EMAIL=${ALERT_EMAIL}
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  db_data:
  grafana_data:

