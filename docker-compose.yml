services:
  db:
    container_name: subsquid_db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: squid
      POSTGRES_PASSWORD: squid
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_connections=200"
      # prevents lock exhaustion during heavy indexing
      - "-c"
      - "max_pred_locks_per_transaction=2048"
      - "-c"
      - "max_locks_per_transaction=2048"
      # Timeout for long-running queries (5 minutes for processors)
      - "-c"
      - "statement_timeout=300000"
      # Query planner optimizations
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d squid"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      target: processor
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: squid
      DB_PASS: squid
    command: ["npm", "run", "db:migrate"]

  processor-polkadot:
    restart: always
    build:
      context: .
      target: processor
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: squid
      DB_PASS: squid
      NOTIFICATION_API_KEY: "${NOTIFICATION_API_KEY}"
      TOOLS_PASSPHRASE: "${TOOLS_PASSPHRASE}"
    command: ["npm", "run", "processor:start"]

  processor-assethub:
    restart: always
    build:
      context: .
      target: processor
    depends_on:
      migrator:
        condition: service_completed_successfully
      processor-polkadot:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: squid
      DB_PASS: squid
      NOTIFICATION_API_KEY: "${NOTIFICATION_API_KEY}"
      TOOLS_PASSPHRASE: "${TOOLS_PASSPHRASE}"
      # Polkadot migration block - AssetHub waits until Polkadot passes this block
      POLKADOT_MIGRATION_BLOCK: "28495696"
      POLL_INTERVAL: "30"
    command: ["bash", "scripts/wait-for-polkadot-migration.sh"]

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:squid@db:5432/squid
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=25
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=10
      # Ignore parameters that squid-graphql-server sends but PgBouncer doesn't support in transaction mode
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,statement_timeout
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    restart: always
    build:
      context: .
      target: query-node
    depends_on:
      migrator:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 5432
      DB_NAME: squid
      DB_PASS: squid
      GQL_PORT: 4350
      # Connection pool settings
      DB_POOL_SIZE: 25
      DB_POOL_MAX: 50
    ports:
      - "${GQL_PORT}:4350"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4350/graphql"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.45.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
      - ./datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.sendgrid.net:587
      - GF_SMTP_USER=apikey
      - GF_SMTP_PASSWORD=${SENDGRID_API_KEY}
      - GF_SMTP_FROM_ADDRESS=${ALERT_EMAIL_1}
      - GF_SMTP_FROM_NAME=Subsquid Alert
      - ALERT_EMAIL_1=${ALERT_EMAIL_1}
      - ALERT_EMAIL_2=${ALERT_EMAIL_2}
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:latest
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  db_data:
  grafana_data:
